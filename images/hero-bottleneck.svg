<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <!-- Static fallback for the hero shader: same geometry as src/components/heroOptics.ts
       (focal 0.64/0.48 uv, four input rays, continuous spectrum fan at ±0.30 rad). -->
  <defs>
    <pattern id="taps" x="13" y="3" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.6" fill="#E8EAE6" fill-opacity="0.05" />
    </pattern>
    <filter id="haze" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
    <radialGradient id="core" cx="1024" cy="468" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6E6" stop-opacity="1" />
      <stop offset="0.06" stop-color="#FAD18C" stop-opacity="0.85" />
      <stop offset="0.25" stop-color="#FAD18C" stop-opacity="0.22" />
      <stop offset="1" stop-color="#FAD18C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spill" cx="1024" cy="468" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAD18C" stop-opacity="0.10" />
      <stop offset="1" stop-color="#FAD18C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="well" cx="300" cy="460" r="720" gradientTransform="translate(300 460) scale(1 0.5) translate(-300 -460)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14161A" stop-opacity="0.92" />
      <stop offset="0.7" stop-color="#14161A" stop-opacity="0.6" />
      <stop offset="1" stop-color="#14161A" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#DBD9CF" stop-opacity="0.14" />
      <stop offset="1" stop-color="#FAD18C" stop-opacity="0.72" />
    </linearGradient>
    <!-- 700 nm (top) to 400 nm (bottom) across the fan -->
    <linearGradient id="spectrum" x1="0" y1="290" x2="0" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7A1410" stop-opacity="0" />
      <stop offset="0.1" stop-color="#D2301E" />
      <stop offset="0.24" stop-color="#F0761E" />
      <stop offset="0.33" stop-color="#EBCB2C" />
      <stop offset="0.48" stop-color="#46C24E" />
      <stop offset="0.62" stop-color="#25B0C2" />
      <stop offset="0.76" stop-color="#2E58E0" />
      <stop offset="0.9" stop-color="#6E3BC4" />
      <stop offset="1" stop-color="#3A1E6A" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="fanFade" x1="1024" y1="0" x2="1600" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.72" />
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.52" />
      <stop offset="1" stop-color="#fff" stop-opacity="0.28" />
    </linearGradient>
    <mask id="fanMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="900">
      <rect width="1600" height="900" fill="url(#fanFade)" />
    </mask>
  </defs>

  <rect width="1600" height="900" fill="#14161A" />
  <rect width="1600" height="900" fill="url(#taps)" />
  <rect width="1600" height="900" fill="url(#spill)" />

  <!-- Exit spectrum: angular dispersion from the aperture -->
  <g filter="url(#haze)" mask="url(#fanMask)">
    <polygon points="1024,466 1600,290 1600,646 1024,470" fill="url(#spectrum)" />
  </g>

  <!-- Input rays converging on the focus -->
  <g stroke="url(#ray)" fill="none" stroke-linecap="round">
    <g filter="url(#haze)" stroke-width="7" opacity="0.26">
      <line x1="-32" y1="126" x2="1024" y2="468" />
      <line x1="-32" y1="234" x2="1024" y2="468" />
      <line x1="-32" y1="333" x2="1024" y2="468" />
      <line x1="-32" y1="414" x2="1024" y2="468" />
    </g>
    <g stroke-width="1.6">
      <line x1="-32" y1="126" x2="1024" y2="468" />
      <line x1="-32" y1="234" x2="1024" y2="468" />
      <line x1="-32" y1="333" x2="1024" y2="468" />
      <line x1="-32" y1="414" x2="1024" y2="468" />
    </g>
  </g>

  <circle cx="1024" cy="468" r="170" fill="url(#core)" />

  <!-- Aperture rings + reticle -->
  <g fill="none" stroke="#E8EAE6" stroke-opacity="0.22" stroke-dasharray="2 6">
    <circle cx="1024" cy="468" r="26" />
    <circle cx="1024" cy="468" r="48" />
    <circle cx="1024" cy="468" r="76" />
  </g>
  <g stroke="#D98E62" stroke-width="1.5">
    <line x1="1031" y1="468" x2="1043" y2="468" />
    <line x1="1017" y1="468" x2="1005" y2="468" />
    <line x1="1024" y1="475" x2="1024" y2="487" />
    <line x1="1024" y1="461" x2="1024" y2="449" />
  </g>

  <rect width="1600" height="900" fill="url(#well)" />
</svg>

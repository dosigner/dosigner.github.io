<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Background -->
  <rect width="1200" height="675" fill="#F0EEE9" />
  
  <!-- Subtle Grid -->
  <g stroke="#D8D2C8" stroke-width="1" stroke-opacity="0.4">
    <line x1="0" y1="135" x2="1200" y2="135" />
    <line x1="0" y1="270" x2="1200" y2="270" />
    <line x1="0" y1="405" x2="1200" y2="405" />
    <line x1="0" y1="540" x2="1200" y2="540" />
    <line x1="240" y1="0" x2="240" y2="675" />
    <line x1="480" y1="0" x2="480" y2="675" />
    <line x1="720" y1="0" x2="720" y2="675" />
    <line x1="960" y1="0" x2="960" y2="675" />
  </g>

  <!-- Isometric Road / Path -->
  <path d="M -200 800 L 400 300 L 700 300 L 1400 800 Z" fill="#EBE5DC" stroke="#D8D2C8" stroke-width="2" />
  <!-- Center line -->
  <line x1="250" y1="550" x2="550" y2="300" stroke="#FBFAF7" stroke-width="6" stroke-dasharray="20 20" />

  <!-- Autonomous Vehicle (Emergency - Abstract) -->
  <g transform="translate(450, 420)">
    <!-- Radar/Sensor Ring -->
    <ellipse cx="0" cy="20" rx="120" ry="40" fill="none" stroke="#677179" stroke-width="1.5" opacity="0.3" stroke-dasharray="8 4" />
    <!-- Vehicle Body -->
    <polygon points="-40,-10 40,-10 60,30 -60,30" fill="#2D2A26" />
    <polygon points="-25,-30 25,-30 40,-10 -40,-10" fill="#8E857A" />
    <circle cx="0" cy="-35" r="4" fill="#C66A3D" /> <!-- Emergency beacon -->
  </g>

  <!-- UAV / Drone (Top Left) -->
  <g transform="translate(300, 180)">
    <!-- Coverage Area (Bird's eye view cone) -->
    <path d="M 0 10 L 350 240 L -50 240 Z" fill="#9A8356" opacity="0.05" />
    <line x1="0" y1="10" x2="350" y2="240" stroke="#9A8356" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
    <line x1="0" y1="10" x2="-50" y2="240" stroke="#9A8356" stroke-width="1" stroke-dasharray="6 6" opacity="0.4" />
    
    <!-- Drone Body -->
    <circle cx="0" cy="0" r="12" fill="#677179" stroke="#2D2A26" stroke-width="2" />
    <line x1="-20" y1="-20" x2="20" y2="20" stroke="#2D2A26" stroke-width="2" />
    <line x1="-20" y1="20" x2="20" y2="-20" stroke="#2D2A26" stroke-width="2" />
    <!-- Rotors -->
    <ellipse cx="-20" cy="-20" rx="15" ry="4" fill="#C66A3D" opacity="0.6" />
    <ellipse cx="20" cy="20" rx="15" ry="4" fill="#C66A3D" opacity="0.6" />
    <ellipse cx="-20" cy="20" rx="15" ry="4" fill="#C66A3D" opacity="0.6" />
    <ellipse cx="20" cy="-20" rx="15" ry="4" fill="#C66A3D" opacity="0.6" />
  </g>

  <!-- V2X Communication Link -->
  <path d="M 300 180 Q 450 250, 450 380" fill="none" stroke="#C66A3D" stroke-width="2" stroke-dasharray="8 8" />
  <circle cx="375" cy="285" r="4" fill="#C66A3D" />

  <!-- Out of sight Obstacle (Detected by drone) -->
  <g transform="translate(600, 320)">
    <rect x="-15" y="-15" width="30" height="30" fill="none" stroke="#C66A3D" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="#C66A3D" stroke-width="2" />
    <line x1="-10" y1="10" x2="10" y2="-10" stroke="#C66A3D" stroke-width="2" />
    <text x="25" y="5" font-family="monospace" font-size="10" fill="#C66A3D">HAZARD_0X</text>
  </g>

  <!-- UI Data Panel (Qualcomm style strategy representation) -->
  <g transform="translate(850, 100)">
    <rect x="0" y="0" width="250" height="180" fill="#FBFAF7" stroke="#D8D2C8" stroke-width="1" rx="4" />
    <text x="20" y="30" font-family="monospace" font-size="12" fill="#625C55" letter-spacing="1">BEAVAR // SYSTEM_ARC</text>
    <line x1="20" y1="45" x2="230" y2="45" stroke="#D8D2C8" stroke-width="1" />
    
    <!-- Topology Diagram -->
    <circle cx="125" cy="80" r="14" fill="#9A8356" opacity="0.2" />
    <circle cx="125" cy="80" r="6" fill="#9A8356" /> <!-- Drone -->
    
    <circle cx="60" cy="140" r="6" fill="#677179" /> <!-- EV -->
    <circle cx="190" cy="140" r="6" fill="#677179" /> <!-- Cloud/MEC -->
    
    <path d="M 125 80 L 60 140" fill="none" stroke="#C66A3D" stroke-width="2" />
    <path d="M 125 80 L 190 140" fill="none" stroke="#D8D2C8" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 60 140 L 190 140" fill="none" stroke="#D8D2C8" stroke-width="2" stroke-dasharray="4 4" />
  </g>

  <!-- Technical Marks -->
  <text x="50" y="50" font-family="monospace" font-size="14" fill="#8E857A" letter-spacing="2">PROJECT_05 // BEAVAR_QUALCOMM_IT_TOUR</text>
  <text x="50" y="620" font-family="monospace" font-size="12" fill="#8E857A">V2X_LATENCY: < 5ms // BANDWIDTH: 5G NR/C-V2X</text>
</svg>
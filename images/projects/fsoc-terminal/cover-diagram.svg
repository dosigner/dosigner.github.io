<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-label="Free-space optical link between two ground terminals through atmospheric turbulence">
  <!-- Palette: bench surface #FAFBF9 · carbon ink #212327 · focal amber #A34E22 · sage #6F7A68 · border #DBDDD7 · dim #8A8E8A -->
  <rect width="960" height="600" fill="#FAFBF9"/>

  <!-- scene scaled 1.22× and recentered so the link sits on the canvas midline -->
  <g transform="translate(480,300) scale(1.22) translate(-480,-415)">

  <!-- ground -->
  <line x1="48" y1="470" x2="912" y2="470" stroke="#DBDDD7" stroke-width="2"/>
  <g stroke="#DBDDD7" stroke-width="1.5">
    <line x1="80" y1="470" x2="70" y2="482"/>
    <line x1="180" y1="470" x2="170" y2="482"/>
    <line x1="280" y1="470" x2="270" y2="482"/>
    <line x1="380" y1="470" x2="370" y2="482"/>
    <line x1="480" y1="470" x2="470" y2="482"/>
    <line x1="580" y1="470" x2="570" y2="482"/>
    <line x1="680" y1="470" x2="670" y2="482"/>
    <line x1="780" y1="470" x2="770" y2="482"/>
    <line x1="880" y1="470" x2="870" y2="482"/>
  </g>

  <!-- beam envelope: expands from A, refocuses into B -->
  <path d="M186 407 C 340 394, 620 394, 774 407 L 774 423 C 620 436, 340 436, 186 423 Z" fill="rgba(163,78,34,0.07)"/>
  <path d="M186 407 C 340 394, 620 394, 774 407" fill="none" stroke="#A34E22" stroke-width="1.5"/>
  <path d="M186 423 C 340 436, 620 436, 774 423" fill="none" stroke="#A34E22" stroke-width="1.5"/>
  <line x1="186" y1="415" x2="774" y2="415" stroke="#A34E22" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.55"/>

  <!-- atmospheric turbulence cells (sage) -->
  <g fill="none" stroke="#6F7A68" stroke-width="1.5" opacity="0.55">
    <circle cx="392" cy="404" r="24"/>
    <circle cx="446" cy="426" r="14"/>
    <circle cx="500" cy="398" r="30"/>
    <circle cx="562" cy="424" r="18"/>
    <circle cx="620" cy="404" r="12"/>
    <circle cx="474" cy="416" r="8"/>
  </g>

  <!-- focal dot — brand grammar -->
  <circle cx="480" cy="415" r="5" fill="#A34E22"/>

  <!-- terminal A (left) -->
  <g stroke="#212327" stroke-width="2" fill="#FAFBF9">
    <rect x="100" y="388" width="82" height="54" rx="4"/>
    <line x1="182" y1="402" x2="182" y2="428" stroke-width="3"/>
    <line x1="120" y1="442" x2="106" y2="470"/>
    <line x1="162" y1="442" x2="176" y2="470"/>
    <line x1="141" y1="442" x2="141" y2="470"/>
  </g>
  <circle cx="128" cy="415" r="9" fill="none" stroke="#212327" stroke-width="1.5"/>

  <!-- terminal B (right) -->
  <g stroke="#212327" stroke-width="2" fill="#FAFBF9">
    <rect x="778" y="388" width="82" height="54" rx="4"/>
    <line x1="778" y1="402" x2="778" y2="428" stroke-width="3"/>
    <line x1="798" y1="442" x2="784" y2="470"/>
    <line x1="840" y1="442" x2="854" y2="470"/>
    <line x1="819" y1="442" x2="819" y2="470"/>
  </g>
  <circle cx="832" cy="415" r="9" fill="none" stroke="#212327" stroke-width="1.5"/>

  <!-- received-intensity trace (scintillation, axis-free) -->
  <polyline points="330,540 350,536 366,543 384,533 400,541 418,537 436,545 452,532 470,540 488,535 506,543 524,531 540,541 558,536 576,544 594,534 610,540 630,537" fill="none" stroke="#A34E22" stroke-width="1.5" opacity="0.5"/>

  <!-- labels (mono, generic concepts only) -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="13" letter-spacing="2" fill="#8A8E8A">
    <text x="141" y="505" text-anchor="middle">TERMINAL A</text>
    <text x="819" y="505" text-anchor="middle">TERMINAL B</text>
    <text x="480" y="342" text-anchor="middle">ATMOSPHERIC TURBULENCE</text>
    <text x="480" y="572" text-anchor="middle" opacity="0.8">RECEIVED INTENSITY</text>
  </g>
  <line x1="480" y1="352" x2="480" y2="380" stroke="#8A8E8A" stroke-width="1" stroke-dasharray="2 4"/>

  </g>
</svg>
